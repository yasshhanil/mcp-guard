[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "Intercept MCP tool calls from Claude and ask the user to Allow or Block each one."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "mcp>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_guard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
